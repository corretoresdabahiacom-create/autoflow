<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoFlow</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    body { margin: 0; font-family: var(--af-font-sans); background: var(--af-color-bg); color: var(--af-color-text); }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    nav { background: var(--af-color-surface); border-right: 1px solid var(--af-color-border); padding: var(--af-space-3); }
    main { padding: var(--af-space-4); }
    a:focus-visible, button:focus-visible { outline: none; box-shadow: var(--af-focus-ring); }
    @media (max-width: 720px) { .shell { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--af-color-border); } }
  </style>
</head>
<body>
  <div class="shell">
    <nav aria-label="Principal"><strong>AutoFlow</strong></nav>
    <main><h1>Em construção</h1><p>Casca do frontend (Fase 1). As telas reais entram a partir da Fase 2.</p></main>
  </div>
</body>
</html>
